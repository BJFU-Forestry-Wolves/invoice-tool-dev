name: Windows Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate release configuration
        shell: pwsh
        run: |
          $config = Get-Content -Raw config/release.json | ConvertFrom-Json
          if ($config.github_repository -eq "OWNER/REPOSITORY") { throw "请先填写 config/release.json" }
      - run: python -m venv .build-venv
      - run: .\.build-venv\Scripts\python.exe -m pip install -r requirements-build.txt
      - run: .\.build-venv\Scripts\python.exe scripts/privacy_check.py --scope tracked
      - run: .\build.ps1
        shell: pwsh
      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\invoice_attachment_tool\invoice_attachment_tool.exe --version
          .\dist\invoice_attachment_tool\invoice_attachment_tool.exe --model-status
          if ($LASTEXITCODE -ne 1) { throw "未安装模型时 --model-status 应返回 1" }
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist\invoice_attachment_tool -DestinationPath dist\invoice_attachment_tool-windows-x64.zip
          $hash = (Get-FileHash dist\invoice_attachment_tool-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  invoice_attachment_tool-windows-x64.zip" | Set-Content -Encoding ascii dist\invoice_attachment_tool-windows-x64.zip.sha256
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist\invoice_attachment_tool-windows-x64.zip dist\invoice_attachment_tool-windows-x64.zip.sha256 --generate-notes
